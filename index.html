<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2185b">
  <meta name="description" content="Gestão de estoque, vendas, cobranças e loja virtual para revendedoras.">
  <title>RevendaOS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head>
<body>
  <div class="carregando"><div class="spin"></div><p>Carregando…</p></div>
  <script type="module" src="assets/app.js"></script>
  <script>
    // Se algum arquivo falhar ao carregar (ex.: GitHub Pages instável logo após publicar), oferece recarregar em vez de girar para sempre
    setTimeout(function () {
      if (!window.__appIniciado && document.querySelector('.carregando p') && document.querySelector('.carregando p').textContent === 'Carregando…') {
        document.querySelector('.carregando').innerHTML = '<p>Não consegui carregar o sistema.</p><p><button onclick="limparERecarregar()" style="padding:10px 18px;border-radius:10px;border:0;background:#c2185b;color:#fff;font-weight:600;cursor:pointer">Recarregar</button></p>';
      }
    }, 12000);
    function limparERecarregar() {
      var p = [];
      if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      Promise.all(p).finally(function () { location.reload(); });
    }
  </script>
</body>
</html>
