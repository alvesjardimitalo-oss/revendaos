name: Converter revistas em catálogo

on:
  release:
    types: [published]          # anexar o PDF numa "Release" (aceita arquivos grandes)
  push:
    paths: ['revistas/**']      # PDF pequeno na pasta revistas/ ou link novo em revistas/links.txt
  schedule:
    - cron: '17 9 * * 1'        # toda segunda às 06:17 (Brasília): confere os links de revistas/links.txt
  workflow_dispatch:            # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: revistas
  cancel-in-progress: false

jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas
        run: pip install pdfplumber==0.11.4 pypdfium2 pillow

      - name: Baixar PDFs da Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _revistas_tmp
          gh release download "${{ github.event.release.tag_name }}" --pattern '*.pdf' --dir _revistas_tmp --clobber
          ls _revistas_tmp/*.pdf > _revistas_tmp/lista.txt
          {
            echo 'PDFS_BAIXADOS<<FIM'
            cat _revistas_tmp/lista.txt
            echo 'FIM'
          } >> "$GITHUB_ENV"

      - name: Converter
        run: python ferramentas/processar_revistas.py

      - name: Salvar no repositório
        run: |
          rm -rf _revistas_tmp
          git config user.name "Atualização automática do catálogo"
          git config user.email "actions@github.com"
          git add -A catalogo-img catalogo-auto revistas
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Catálogo atualizado a partir das revistas"
          git pull --rebase
          git push
